<div class="calendar-container">
  <div class="header"></div>
  @for (day of days; track $index) {
    <div class="header">
      {{ day }}
    </div>
  }
  @for (hour of hours(); track $index) {
    <div class="time-slot">{{ hour }}</div>
    @for (day of days; track $index) {
      <div
        class="calendar-cell"
        [class.selected]="selectedCells().has(day + '-' + hour)"
        (mousedown)="onDragStart(day, hour)"
        (mouseenter)="onDragOver(day, hour)"
      ></div>
    }
  }
  @for (event of events(); track $index) {
    <app-event
      class="event"
      [event]="event"
      [editing]="event === editedEvent()"
      (edited)="startEditing(event)"
      (deleted)="deleteEvent(event)"
      (confirm)="confirmEvent(event, $event)"
    ></app-event>
  }
</div>
