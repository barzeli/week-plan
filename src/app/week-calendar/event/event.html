<div class="event-header">
  <div class="event-time">{{ event() | eventTimeRange: 30 }}</div>
  <div class="header-controls">
    <button
      type="button"
      class="color-picker-toggle"
      [style.background]="event().color"
      (click)="isColorPickerOpen.set(!isColorPickerOpen()); $event.stopPropagation()"
      aria-label="בחר צבע"
    ></button>
    <button
      class="header-action-btn delete-btn"
      (click)="onDelete($event)"
      title="Delete"
      aria-label="מחק אירוע"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>
</div>

<div class="event-content">
  @if (editing()) {
    <input
      #titleInput
      type="text"
      [(ngModel)]="event().title"
      (keydown)="onTitleKeyDown($event)"
      (click)="$event.stopPropagation()"
      placeholder="כותרת..."
    />
  } @else {
    <div class="event-title">{{ event().title }}</div>
  }
</div>

@if (isColorPickerOpen()) {
  <div
    class="inline-color-picker"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    tabindex="-1"
  >
    <app-color-picker
      [selectedColor]="event().color"
      (colorSelected)="onColorSelected($event)"
    ></app-color-picker>
  </div>
}
