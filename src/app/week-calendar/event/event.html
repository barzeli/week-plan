<div class="event-header">
  <div class="event-time">{{ event() | eventTimeRange: 30 }}</div>
  <div class="header-controls">
    <app-color-picker
      [selectedColor]="event().color"
      (colorSelected)="onColorSelected($event)"
    ></app-color-picker>
    <button
      class="delete-button material-symbols-outlined"
      (click)="onDelete($event)"
      title="Delete"
    >
      delete
    </button>
  </div>
</div>

<div class="event-content">
  @if (editing()) {
    <input
      #titleInput
      class="title-input"
      [(ngModel)]="event().title"
      (keydown)="onTitleKeyDown($event)"
      placeholder="כותרת..."
    />
  } @else {
    <div class="event-title" (dblclick)="editTitle()">{{ event().title }}</div>
  }
</div>
