<div class="event-header">
  <div class="event-time">{{ event().displayTime }}</div>
  <div class="header-controls">
    <button
      type="button"
      class="color-picker-toggle"
      [style.background]="event().color"
      (click)="isOpen.set(!isOpen()); $event.stopPropagation()"
    ></button>
    <button class="header-action-btn delete-btn" (click)="onDelete($event)" title="Delete">
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="3 6 5 6 21 6"></polyline>
        <path
          d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
        ></path>
      </svg>
    </button>
  </div>
</div>

<div class="event-content">
  @if (editingNow()) {
    <input
      #titleInput
      type="text"
      [(ngModel)]="event().title"
      (keydown)="onTitleKeyDown($event)"
      (click)="$event.stopPropagation()"
      placeholder="כותרת..."
    />
  } @else {
    <div class="event-title">{{ event().title }}</div>
  }
</div>

@if (isOpen()) {
  <div class="inline-color-picker" (click)="$event.stopPropagation()">
    <app-color-picker
      [selectedColor]="event().color"
      (colorSelected)="onColorSelected($event)"
    ></app-color-picker>
  </div>
}
